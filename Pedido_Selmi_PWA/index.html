<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8102e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talão de Pedido Selmi 2026</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mut:#6b7280;--line:#e5e7eb;--red:#c8102e;--red2:#a30d25;--ok:#0f7b4a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.35 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:var(--red);color:#fff;padding:12px 14px 10px}
.brand{background:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 9px;display:flex;align-items:center;justify-content:center;gap:20px;border-bottom:1px solid var(--line)}
.brand img{height:34px;width:auto;display:block}
header h1{margin:0;font-size:17px;letter-spacing:.2px}
header small{opacity:.85}
.wrap{max-width:720px;margin:0 auto}
details.cab{background:var(--card);margin:10px;border-radius:12px;border:1px solid var(--line)}
details.cab summary{padding:12px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.cab summary::after{content:"▾";color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.grid .full{grid-column:1/-1}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:56px;resize:vertical}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 10px 6px}
.search{font-size:16px;padding:12px 14px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.sec{margin:14px 12px 4px;font-weight:700;font-size:13px;color:var(--red2);text-transform:uppercase;letter-spacing:.3px}
.pack{margin:0 12px 6px;font-size:12px;color:var(--mut)}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:var(--card);margin:0 10px 6px;padding:9px 10px;border-radius:12px;border:1px solid var(--line)}
.item.has{border-color:var(--ok);background:#f2fbf6}
.item .nm{flex:1 1 100%;min-width:0}
.item .ctl{display:flex;align-items:flex-end;gap:8px;width:100%}
.item .ctl .pr{flex:1;min-width:0}
.item .ctl .pr label,.dsc label,.upc label{font-size:10px;margin:0 0 2px}
.item .ctl .pr input{padding:8px 6px;font-size:15px}
.ctl2{display:flex;align-items:center;gap:8px;width:100%;justify-content:space-between}
.upc{width:62px}
.upc input{padding:8px 4px;text-align:center;font-size:15px}
.sub{flex:1;text-align:right;font-weight:700;font-size:13px;color:var(--ok);min-height:18px;align-self:center}
.item .nm b{display:block;font-size:14.5px;font-weight:600}
.item .nm span{font-size:11.5px;color:var(--mut)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:20px;line-height:1;color:var(--ink)}
.qty input{width:50px;text-align:center;padding:8px 2px;font-size:16px;font-weight:600}
.dsc{width:70px}
.dsc input{padding:8px 4px;text-align:center;font-size:14px}
.dsc label{text-align:center;margin:0}
.empty{text-align:center;color:var(--mut);padding:30px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:9}
.bar .tot{flex:1}
.bar .tot b{font-size:20px;display:block}
.bar .tot span{font-size:12px;color:var(--mut)}
.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;background:var(--red);color:#fff}
.btn.sec2{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#1fa855}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:18px}
.sum{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.sum td,.sum th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.sum td.r,.sum th.r{text-align:right;white-space:nowrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts .full{grid-column:1/-1}
.msg{font-size:12.5px;color:var(--ok);min-height:18px;margin-top:6px}
a.btn{text-decoration:none;text-align:center;display:block}
.hb{float:right;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600}
.hcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.hcard b{display:block}
.hcard .m{font-size:12.5px;color:var(--mut)}
.hcard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hcard .row button{padding:8px 11px;font-size:13px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600}
.hcard .row button.d{color:var(--red)}
.hcard pre{white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;background:#f7f7f8;padding:8px;border-radius:8px;margin:8px 0 0;display:none}
.hcard pre.on{display:block}
.ref{width:100%;font-size:11.5px;color:var(--mut);line-height:1.35}
.ref b{font-weight:600;color:var(--ink)}
.ref .st{color:#9a3412}
.ref .dlt{font-weight:700}
.ref .dlt.lo{color:var(--red)}
.ref .dlt.hi{color:var(--ok)}
.pr input.lo{border-color:var(--red);background:#fff1f2;color:var(--red2);font-weight:700}
.pr input.hi{border-color:var(--ok);background:#f0fdf4;color:var(--ok);font-weight:700}
.tab{margin:0 10px 6px;font-size:11.5px;color:var(--mut)}
#tms{display:block;font-size:12px;color:#9a3412;font-weight:600}
.sub .st{color:#9a3412;font-weight:600}
.sub .bn{color:#1d4ed8;font-weight:600}
#tr{display:block;font-weight:700}
#tr.hi{color:var(--ok)}
#tr.lo{color:var(--red)}
</style>
</head>

function encF(){const e=ENC[st.f.prazo];return e===undefined?null:e}
// up(): arredonda sempre para cima, no centavo
function up(n){return Math.ceil(Math.round(n*10000)/100)/100}
function ref(c){const d=PO[c];if(!d)return null;const e=encF();if(e===null)return null;
 const poe=up(d[0]*(1+e)), pu=Math.round(d[1]/d[2]*10000)/10000, n=upc(BYC[c]);
 const un=up(poe*pu), cx=up(un*n), unST=up(un*(1+d[3]/100));
 return {poe,un,cx,st:d[3],unST,cxST:up(unST*n)}}
function gk(c){const i=BYC[c];return i.s+'|'+i.g}
function autoP(c,row){if(st.p[c])return false;const g=(st.gp||{})[gk(c)];if(!g)return false;

 return true}
function bon(c){const o=st.q[c];return o?Math.max(0,parseInt(o.b)||0):0}
function vol(c){const o=st.q[c];return (o&&o.q>0?o.q:0)+bon(c)}
function eff(c){const v=vol(c),n=upc(BYC[c]);return v>0&&n>0?line(c)/v/n:0}
function cls(c){const r=ref(c),p=eff(c);if(!r||!(p>0))return '';return p<r.un?'lo':'hi'}
function rent(){let t=0,b=0;for(const i of sel()){const r=ref(i.c);if(!r||!(num(st.p[i.c])>0))continue;t+=line(i.c);b+=vol(i.c)*r.cx}return {neg:t,tab:b,dif:t-b,pct:b>0?(t/b-1)*100:0}}
function sgn(n){return (n<0?'\u2212':'+')+brl(Math.abs(n))}
function pct(n){return (n>=0?'+':'')+n.toFixed(1).replace('.',',')+'%'}
function refLine(c){const r=ref(c);
 if(!r)return PO[c]?'Escolha o prazo para ver o pre\u00e7o de tabela':'Sem pre\u00e7o de tabela';
 let s='Tabela: <b>'+brl(r.un)+'</b>/un \u00b7 '+brl(r.cx)+'/cx';
 if(r.st)s+=' \u00b7 <span class="st">c/ ST '+r.st.toFixed(2).replace('.',',')+'%: '+brl(r.unST)+'/un \u00b7 '+brl(r.cxST)+'/cx</span>';

 return s}
function upc(it){const o=num(st.u[it.c]);return o>0?o:it.u}
// preco por caixa fechado no centavo, p/ cima: assim qtd x caixa bate com o total
function box(c){return up(upc(BYC[c])*num(st.p[c]))}
function line(c){const o=st.q[c];if(!o||!(o.q>0))return 0;return o.q*box(c)}
function stp(c){const d=PO[c];return d?d[3]:0}
function boxST(c){return up(box(c)*(1+stp(c)/100))}
function lineST(c){const o=st.q[c];if(!o||!(o.q>0))return 0;return o.q*boxST(c)}
function moneyST(){return sel().reduce((a,i)=>a+lineST(i.c),0)}
function sub(c){const b=box(c);if(!(b>0))return '';const l=line(c),bo=bon(c),n=upc(BYC[c]);

 h+=`<tr><th>TOTAL</th><th class="r">${v}</th><th class="r">${brl(money())}</th></tr>`;
 const _ms=moneyST();if(_ms>money())h+=`<tr><th style="color:#9a3412">TOTAL c/ ST</th><th></th><th class="r" style="color:#9a3412">${brl(_ms)}</th></tr>`;
 const rr=rent();if(rr.tab>0)h+=`<tr><td colspan="2" style="color:var(--mut)">Rentabilidade vs. tabela<br><span style="font-size:11px">uso interno \u2014 n\u00e3o sai no WhatsApp nem no .txt</span></td><td class="r" style="font-weight:700;color:${rr.dif<0?'var(--red)':'var(--ok)'}">${sgn(rr.dif)}<br><span style="font-size:11px">${pct(rr.pct)}</span></td></tr>`;
 $('sum').innerHTML=h;
 $('wa').href='https://wa.me/?text='+encodeURIComponent(text());
 $('msg').textContent='';
 $('modal').classList.add('on');
}
$('bsum').onclick=openSum;
$('cx').onclick=()=>$('modal').classList.remove('on');
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('on')});
$('cp').onclick=async()=>{
 try{await navigator.clipboard.writeText(text(true));$('msg').textContent='Pedido copiado.'}
 catch(e){const ta=document.createElement('textarea');ta.value=text(true);document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();$('msg').textContent=ok?'Pedido copiado.':'Não foi possível copiar — use o botão do WhatsApp.'}
};
// Limpar apaga tudo: dados do pedido, quantidades, descontos e custos
$('bcl').onclick=()=>{
 if($('bcl').dataset.arm){const d=new Date();
  st.q={};st.p={};st.u={};st.gp={};st.cur=null;
  st.f={data:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
  save();loadFields();renderList();totals();$('bcl').textContent='Limpar';delete $('bcl').dataset.arm;return}
 $('bcl').dataset.arm=1;$('bcl').textContent='Confirmar?';
 setTimeout(()=>{if($('bcl').dataset.arm){delete $('bcl').dataset.arm;$('bcl').textContent='Limpar'}},3000);
};
function pad(n){return String(n).padStart(2,'0')}
function stamp(ts){const d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fname(f,ts){const d=new Date(ts||Date.now());const c=(f.razao||'pedido').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,30)||'pedido';return 'Pedido_'+c+'_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.txt'}
function orderCsv(q,p){return ITEMS.filter(i=>q[i.c]&&((q[i.c].q>0)||(parseInt(q[i.c].b)||0)>0)).map(i=>{const o=q[i.c];const b=Math.max(0,parseInt(o.b)||0);return i.c.replace(/\./g,'')+';'+(o.q||0)+';'+b+';'+num(p[i.c]).toFixed(2)}).join('\n')+'\n'}
function download(name,txt,msgEl){
 try{const b=new Blob([txt],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);msgEl.textContent='Arquivo gerado: '+name+' (se não baixou, use "Copiar texto").'}
 catch(e){msgEl.textContent='Não foi possível baixar — use "Copiar texto".'}
}
async function copyTxt(txt,msgEl){
 try{await navigator.clipboard.writeText(txt);msgEl.textContent='Copiado.'}
 catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();msgEl.textContent=ok?'Copiado.':'Não foi possível copiar.'}
}
function saveOrder(){
 const s=sel();if(!s.length){$('msg').textContent='Adicione ao menos um item antes de salvar.';return}
 const pp={},uu={};s.forEach(i=>{if(st.p[i.c])pp[i.c]=st.p[i.c];if(st.u[i.c])uu[i.c]=st.u[i.c]});
 const e={id:st.cur||('o'+Date.now()),ts:Date.now(),f:JSON.parse(JSON.stringify(st.f)),q:JSON.parse(JSON.stringify(st.q)),pp,uu,
  vol:s.reduce((a,i)=>a+st.q[i.c].q,0),itens:s.length,val:money(),t:text()};
 const ix=st.h.findIndex(x=>x.id===e.id);
 if(ix>=0){e.ts=st.h[ix].ts;st.h[ix]=e}else st.h.unshift(e);
 st.cur=e.id;save();
 $('msg').textContent='Pedido salvo no histórico.';
}
function renderHist(){
 if(!st.h.length){$('hl').innerHTML='<div class="empty">Nenhum pedido salvo ainda.<br>Use "Salvar no histórico" no resumo do pedido.</div>';return}
 $('hl').innerHTML=st.h.slice().sort((a,b)=>b.ts-a.ts).map(e=>`<div class="hcard" data-id="${e.id}"><b>${esc(e.f.razao||'Sem cliente')}${e.f.ped?' · Pedido '+esc(e.f.ped):''}</b>
 <div class="m">${stamp(e.ts)} · ${e.vol} volumes · ${e.itens} itens${e.val>0?' · '+brl(e.val):''}${st.cur===e.id?' · <b style="display:inline;color:var(--ok)">em edição</b>':''}</div>
 <div class="row"><button data-a="ver">Ver</button><button data-a="abrir">Abrir/editar</button><button data-a="cop">Copiar</button><button data-a="txt">.txt</button><button data-a="wa">WhatsApp</button><button class="d" data-a="del">Excluir</button></div>
 <pre>${esc(e.t.replace(/\*/g,''))}</pre></div>`).join('')
}
function loadFields(){FIELDS.forEach(k=>{$('f_'+k).value=st.f[k]||''})}
$('bh').onclick=()=>{renderHist();$('hmsg').textContent='';$('hm').classList.add('on')};
$('hx').onclick=()=>$('hm').classList.remove('on');
$('hm').addEventListener('click',e=>{if(e.target.id==='hm')$('hm').classList.remove('on')});
$('hnew').onclick=()=>{
 const keep={rep:st.f.rep,prazo:st.f.prazo};const d=new Date();
 st.f={...keep,data:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};st.q={};st.cur=null;save();
 loadFields();renderList();totals();$('hm').classList.remove('on');window.scrollTo(0,0);
};
$('hl').addEventListener('click',e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const card=b.closest('.hcard'),en=st.h.find(x=>x.id===card.dataset.id);if(!en)return;
 const a=b.dataset.a;
 if(a==='ver')card.querySelector('pre').classList.toggle('on');
 else if(a==='abrir'){st.f=JSON.parse(JSON.stringify(en.f));st.q=JSON.parse(JSON.stringify(en.q));Object.assign(st.p,en.pp||{});Object.assign(st.u,en.uu||{});st.cur=en.id;save();loadFields();renderList();totals();$('hm').classList.remove('on');window.scrollTo(0,0)}
 else if(a==='cop')copyTxt(en.t.replace(/\*/g,''),$('hmsg'));
 else if(a==='txt')download(fname(en.f,en.ts),orderCsv(en.q,en.pp||{}),$('hmsg'));
 else if(a==='wa'){const l=document.createElement('a');l.href='https://wa.me/?text='+encodeURIComponent(en.t);l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove()}
 else if(a==='del'){if(b.dataset.arm){st.h=st.h.filter(x=>x.id!==en.id);if(st.cur===en.id)st.cur=null;save();renderHist()}else{b.dataset.arm=1;b.textContent='Confirmar?';setTimeout(()=>{b.dataset.arm='';b.textContent='Excluir'},3000)}}
});
$('sv').onclick=saveOrder;
$('dl').onclick=()=>download(fname(st.f),orderCsv(st.q,st.p),$('msg'));
$('f_prazo').addEventListener('change',()=>{st.f.prazo=$('f_prazo').value;save();renderList()});
renderChips();renderList();totals();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
